<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winter Sale na lista de desejos — Kurokami Hunter</title>
<style>
/* paleta Kurokami: --acao compra, --sinal ativo/importante, --azul texto clicável; calor #2a1a1a → #4a1016 → #8a1520 → #d63031 → #ff4757 */
:root{--bg:#050505;--pan:#0f0f0f;--pan2:#181818;--txt:#d2d2d2;--fraco:#9a9a9a;--dim:#7a7a7a;--azul:#ff7675;--sinal:#ff4757;--acao:#d63031;--vbg:#4a1016;--vtx:#ff8a94;--borda:#ffffff14}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 1000px 380px at 50% -140px,#5a0f18 0,#050505 70%) no-repeat,var(--bg);background-color:var(--bg);color:var(--txt);font:14px/1.45 "Motiva Sans",Arial,Helvetica,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--azul);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--sinal);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:0 16px 60px}
header{padding:22px 0 4px}
h1{margin:0;font-size:26px;font-weight:300;color:#fff}h1 b{color:var(--sinal);font-weight:400}
header p{margin:4px 0 0;color:var(--fraco)}
[data-calor="0"]{background:#1a1a1a;color:#888}[data-calor="1"]{background:#2a1a1a;color:#e8b4b4}[data-calor="2"]{background:var(--vbg);color:var(--vtx)}[data-calor="3"]{background:#8a1520;color:#fff}[data-calor="4"]{background:var(--acao);color:#fff}[data-calor="5"]{background:var(--sinal);color:#000}
.ch{font-size:12.5px;padding:1px 6px;white-space:nowrap}
/* vereditos: compre já = ação; inverno = sinal; espere mais / não compre = cinza */
.vd-ja{--vc:var(--acao)}.vd-inverno{--vc:var(--sinal)}.vd-mais{--vc:#8a8a8a}.vd-nao{--vc:#555}
.cestas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.cesta{background:#0d0d0dd9;border:0;text-align:left;padding:12px 14px;cursor:pointer;box-shadow:inset 3px 0 0 var(--vc);min-width:0}
.cesta:hover{background:#161616}.cesta[aria-pressed=true]{background:#1c1c1c;box-shadow:inset 3px 0 0 var(--vc),0 0 0 1px #ffffff2a}
.cesta small{display:block;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.cesta b{display:block;color:#fff;font-weight:400;font-size:21px;margin-top:2px}
.cesta span{color:var(--fraco);font-size:12.5px}
.cesta span em{color:var(--vtx);font-style:normal}
.palco{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
/* lista */
.lado{background:var(--pan);position:sticky;top:10px;display:flex;flex-direction:column;max-height:calc(100vh - 20px)}
.lado .filtros{padding:10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--borda)}
.lado input,.lado select{background:var(--pan2);border:1px solid var(--borda);padding:6px 9px;width:100%}
.lista{overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#333 transparent}
.it{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;padding:6px 10px;cursor:pointer;border:0;background:none;width:100%;text-align:left;box-shadow:inset 3px 0 0 transparent}
.it:hover{background:#151515}.it[aria-current=true]{background:#1d1d1d;box-shadow:inset 3px 0 0 var(--vc)}
.it .mini{aspect-ratio:460/215;background:#151515;overflow:hidden;position:relative}
.it .mini img{width:100%;height:100%;object-fit:cover;display:block}
.it .in{min-width:0;display:flex;flex-direction:column}.it .nm{color:#ddd;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .pr{font-size:12px;color:var(--dim)}.it .pr b{color:#fff;font-weight:400}.it .pr i{font-style:normal;color:var(--vtx)}
.lado .cont{padding:6px 10px;color:var(--dim);font-size:12px;border-top:1px solid var(--borda)}
/* ficha */
.ficha{background:var(--pan);min-width:0}
.topo{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:18px;padding:16px}
.topo .cap{aspect-ratio:460/215;background:#151515;overflow:hidden;position:relative;display:block}
.topo .cap img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:#fff;background:linear-gradient(135deg,#1a1a1a,#3a0d12)}
.cap img+.ph,.mini img+.ph{display:none}
.mini .ph{font-size:9px;padding:2px}
.topo h2{margin:0;color:#fff;font-weight:400;font-size:24px;line-height:1.2}
.topo .meta{color:var(--fraco);font-size:13px;margin-top:4px}
.veredito{margin-top:12px;padding:12px 14px;background:#141414;box-shadow:inset 4px 0 0 var(--vc)}
.veredito b{display:block;color:#fff;font-size:20px;font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.veredito.vd-ja b,.veredito.vd-inverno b{color:var(--vc)}
.veredito p{margin:4px 0 0;color:var(--txt)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--borda);margin:0 16px}
.trio>div{background:#121212;padding:12px 14px}
.trio small{display:block;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.trio b{display:block;color:#fff;font-size:26px;font-weight:300;margin:2px 0}
.trio span{color:var(--fraco);font-size:12.5px}
.trio .eco b{color:var(--vtx)}
.bloco{padding:14px 16px 0}
.bloco h3{margin:0 0 8px;color:#fff;font-weight:400;font-size:15px}
.grafico svg{width:100%;height:auto;display:block;background:#0b0b0b}
.legenda{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:6px}
.legenda i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.por{margin:0;padding:0 0 0 18px}.por li{margin:0 0 7px}.por li::marker{color:var(--sinal)}
.por b{color:#fff;font-weight:400}
.det{width:100%;border-collapse:collapse;font-size:13px}
.det td{padding:6px 0;border-top:1px solid var(--borda);vertical-align:top}.det td:first-child{color:var(--dim);width:36%;padding-right:12px}
.irmaos{display:flex;gap:6px;flex-wrap:wrap}
.irmaos button{background:var(--pan2);border:0;padding:3px 8px;cursor:pointer;color:var(--azul);font-size:12.5px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;margin-top:14px;border-top:1px solid var(--borda)}
.nav button{background:var(--pan2);border:0;padding:8px 14px;cursor:pointer}
.nav .prox{background:var(--acao);color:#fff}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{color:var(--dim);font-size:12.5px}
footer{margin-top:22px;color:var(--dim);font-size:12.5px;line-height:1.6}
@media (max-width:900px){.palco{grid-template-columns:1fr}.lado{position:static;max-height:300px}.cestas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.topo{grid-template-columns:1fr}.trio{grid-template-columns:1fr}.cesta b{font-size:18px}h1{font-size:21px}.topo h2{font-size:20px}}
</style>
</head>
<body>
<main>
<header>
  <h1>Winter Sale <b>2026</b>: o que comprar da sua lista</h1>
  <p id="sub"></p>
</header>
<div class="cestas" id="cestas"></div>
<div class="palco">
  <aside class="lado">
    <div class="filtros">
      <input id="busca" type="search" placeholder="Buscar jogo" aria-label="Buscar jogo">
      <select id="fr" aria-label="Franquia"></select>
      <select id="ordem" aria-label="Ordem"><option value="">Ordem recomendada</option><option value="eco">Maior economia</option><option value="wn">Mais barato no inverno</option><option value="rp">Mais bem avaliado</option><option value="n">Nome</option></select>
    </div>
    <div class="lista" id="lista"></div>
    <div class="cont" id="cont"></div>
  </aside>
  <article class="ficha" id="ficha" tabindex="-1"></article>
</div>
<footer id="rodape"></footer>
</main>
<script>
/*DADOS*/
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=c=>'R$ '+(c/100).toFixed(2).replace('.',',');
const brl0=c=>'R$ '+Math.round(c/100).toLocaleString('pt-BR');
const mil=n=>(n||0).toLocaleString('pt-BR');
const calor=p=>p>=80?5:p>=65?4:p>=50?3:p>=30?2:p>0?1:0;
const corte=(g,p)=>Math.max(0,Math.round(100*(1-p/g.ch)));
const chip=(g,p)=>{const c=corte(g,p);return `<span class="ch" data-calor="${calor(c)}">${c?'-'+c+'%':'cheio'}</span>`};
const mesAno=s=>s?s.slice(5,7)+'/'+s.slice(0,4):'';
const VD={ja:['Compre já','Hoje já custa o que deve custar no inverno.'],inverno:['Compre na Winter Sale','Espere até '+M.inicio+': vai sair mais barato.'],
  mais:['Espere mais','É lançamento recente: o melhor preço vem depois do inverno.'],nao:['Não compre','As avaliações não sustentam a compra.']};
const ORD=['ja','inverno','mais','nao'];
const CDN='https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/',CL='https://cdn.cloudflare.steamstatic.com/steam/apps/';
const url=(g,x,pad)=>x==null?null:typeof x==='string'&&/^https?:/.test(x)?x:CDN+(x===1?g.a+'/'+pad:x[0]==='/'?x.slice(1):g.a+'/'+x);
const capas=g=>[url(g,g.hd,'header.jpg'),CL+g.a+'/header.jpg',url(g,g.cv,'library_600x900_2x.jpg')].filter(Boolean);
const GA=new Map(L.map(g=>[g.a,g]));
function cf(img){const c=capas(GA.get(+img.dataset.a)),i=(+img.dataset.s||0)+1;if(i>=c.length){img.remove();return;}img.dataset.s=i;img.src=c[i];}
const img=(g,lazy)=>`<img ${lazy?'loading="lazy"':''} data-a="${g.a}" src="${capas(g)[0]}" alt="" onerror="cf(this)"><span class="ph">${esc(g.n)}</span>`;
const onde=g=>g.on==='keyshop'?'na keyshop':'na '+esc(g.on);
const FR=new Map();L.forEach(g=>{if(g.fr){if(!FR.has(g.fr))FR.set(g.fr,[]);FR.get(g.fr).push(g)}});
// ---------------------------------------------------- motivos (o "porquê" de cada ficha)
function motivos(g){
  const p=[],pct=g.ag?Math.round(100*g.eco/g.ag):0;
  if(g.vd==='inverno')p.push(`Hoje o melhor preço é <b>${brl(g.ag)}</b> ${onde(g)}. No inverno estimo <b>${brl(g.wn)}</b>: esperando, você economiza <b>${brl(g.eco)} (${pct}%)</b>.`);
  else if(g.vd==='ja')p.push(`Hoje já está a <b>${brl(g.ag)}</b> ${onde(g)}, e estimo <b>${brl(g.wn)}</b> para o inverno. A diferença é de no máximo 3%, então não vale a pena esperar.`);
  else if(g.vd==='mais')p.push(`Lançado há ${g.al.idade} meses. Jogos desta faixa de preço costumam chegar a <b>-${g.al.k}% (${brl(Math.round(g.ch*(100-g.al.k)/100))})</b> com uns ${g.al.med||24} meses de lançamento. No inverno ele deve cair a ${brl(g.wn)}, mas o melhor preço vem depois.`);
  else p.push(`Só <b>${g.rp}%</b> das ${mil(g.rc)} análises da Steam são positivas. Mesmo a ${brl(g.wn)} no inverno, a sua lista tem apostas mais seguras.`);
  const [folga,chance,novo,velho]=g.xm||[0,0,0,0];
  if(g.rec&&corte(g,g.rec)>=3){
    const c=corte(g,g.rec),r=[];
    if(folga>=60)r.push(`o recorde ainda é um desconto raso (-${c}%), então tem espaço para cair`);
    else if(folga<=20)r.push(`o recorde já é um desconto fundo (-${c}%), então sobra pouco espaço`);
    else r.push(`o recorde é um desconto médio (-${c}%)`);
    if(velho>=75)r.push(`ele é antigo (${mesAno(g.recq)})`);
    if(novo)r.push('o jogo é novo e ainda não teve o desconto típico');
    r.push(chance>=50?`o histórico já dá ${chance}% de chance de recorde`:`pelo histórico, a chance de recorde é só de ${chance}%`);
    p.push(`O menor preço da história é <b>${brl(g.rec)}</b> na ${esc(g.recl)} (${mesAno(g.recq)}). Estimo o novo recorde <b>${g.x}% abaixo</b> dele, porque ${r.slice(0,-1).join(', ')} e ${r[r.length-1]}.`);
  } else p.push(`Ele nunca teve desconto com o preço cheio de hoje. Estimo a primeira promoção em <b>-${corte(g,g.wn)}%</b>, uma aposta: jogos que nunca entram em promoção costumam continuar assim.`);
  if(g.iv&&g.iv.length)p.push('Invernos passados: '+g.iv.map(([y,pr,lj])=>`${y}, ${brl(pr)} (-${corte(g,pr)}%) na ${esc(lj)}`).join('; ')+'.');
  if(g.cp)p.push(`Com ${g.cp.n>1?'as '+g.cp.n+' expansões':'a expansão'} que você não tem, o pacote custa ${brl(g.cp.hoje)} hoje${g.cp.como?' ('+esc(g.cp.como)+')':''} e deve sair por uns <b>${brl(g.cp.inv)}</b> no inverno.`);
  return p;
}
// ---------------------------------------------------- gráfico: 36 meses da Steam + recorde + estimativa
function grafico(g){
  const h=g.h36||[],W=720,H=170,pl=44,pr=70,pt=12,pb=24,n=h.length;
  const vals=h.filter(v=>v!=null).concat([g.ch/100,g.wn/100,g.ag/100,g.rec?g.rec/100:0]);
  const max=Math.max(...vals)*1.05||1;
  const X=i=>pl+(W-pl-pr)*i/n,Y=v=>pt+(H-pt-pb)*(1-v/max);
  let d='',ant=null;h.forEach((v,i)=>{if(v==null){ant=null;return}d+=(ant==null?`M${X(i)},${Y(v)}`:`L${X(i)},${Y(v)}`)+`L${X(i+1)},${Y(v)}`;ant=v;});
  const [ay,am]=M.mes.split('-').map(Number);
  const lab=[];for(let i=0;i<n;i+=6){let mm=am-(n-1-i),yy=ay;while(mm<=0){mm+=12;yy--}lab.push(`<text x="${X(i)}" y="${H-6}" fill="#7a7a7a" font-size="11">${String(mm).padStart(2,'0')}/${String(yy).slice(2)}</text>`)}
  const perto=g.rec&&Math.abs(Y(g.rec/100)-Y(g.wn/100))<13;   // rótulos colados: recorde sobe, inverno desce
  const ref=(v,cor,tx,dy)=>`<line x1="${pl}" x2="${W-pr+6}" y1="${Y(v)}" y2="${Y(v)}" stroke="${cor}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-pr+10}" y="${Y(v)+4+dy}" fill="${cor}" font-size="11">${tx}</text>`;
  const ticks=[0,.5,1].map(f=>{const v=max*f;return `<text x="${pl-6}" y="${Y(v)+4}" fill="#7a7a7a" font-size="11" text-anchor="end">${Math.round(v)}</text><line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ffffff10"/>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Preço na Steam nos últimos 36 meses">${ticks}
    ${g.rec?ref(g.rec/100,'#9a9a9a','recorde',perto?-6:0):''}${ref(g.wn/100,'#ff4757','inverno',perto?6:0)}
    <path d="${d}" fill="none" stroke="#d2d2d2" stroke-width="2"/>${lab.join('')}
    <circle cx="${X(n)}" cy="${Y(g.ag/100)}" r="4" fill="#d63031"/></svg>`;
}
// ---------------------------------------------------- ficha
let vis=[],atual=0;
function ficha(g){
  const i=vis.indexOf(g),irm=(FR.get(g.fr)||[]).filter(x=>x!==g);
  const det=[
    ['Preço cheio (Steam)',brl(g.ch)],
    ['Melhor preço hoje',`${brl(g.ag)} ${onde(g)}${g.k&&g.on!=='keyshop'?' · keyshop '+brl(g.k):''}`],
    ['Menor preço da história',g.rec?`${brl(g.rec)} na ${esc(g.recl)} (${mesAno(g.recq)}) ${chip(g,g.rec)}`:'—'],
    ['Novo recorde estimado',`${brl(g.wn)} ${chip(g,g.wn)} · ${g.x}% abaixo do recorde`],
    ['Chance de recorde pelo histórico',`${g.pn}%`],
    ['Com expansões',g.cp?`${brl(g.cp.hoje)} hoje · ~${brl(g.cp.inv)} no inverno (${g.cp.n} DLC${g.cp.n>1?'s':''})`:'não precisa'],
    ['Avaliações',g.rp?`${g.rp}% positivas · ${mil(g.rc)} análises`:'—'],
  ];
  return `<div class="topo"><a class="cap" href="https://store.steampowered.com/app/${g.a}" target="_blank" rel="noopener">${img(g)}</a>
    <div><h2>${esc(g.n)}</h2><div class="meta">${[g.ano,g.rp?g.rp+'% positivas':'',g.fr&&irm.length?'franquia '+esc(g.fr):''].filter(Boolean).join(' · ')}</div>
    <div class="veredito vd-${g.vd}"><b>${VD[g.vd][0]}</b><p>${VD[g.vd][1]}</p></div></div></div>
  <div class="trio"><div><small>Hoje</small><b>${brl(g.ag)}</b><span>${onde(g)} ${chip(g,g.ag)}</span></div>
    <div><small>No inverno (novo recorde)</small><b>${brl(g.wn)}</b><span>${M.inicio} a ${M.fim} ${chip(g,g.wn)}</span></div>
    <div class="eco"><small>Você economiza</small><b>${g.vd==='ja'?'—':brl(g.eco)}</b><span>${g.vd==='ja'?'compre agora':g.ag?Math.round(100*g.eco/g.ag)+'% do preço de hoje':''}</span></div></div>
  <div class="bloco"><h3>Por quê</h3><ul class="por">${motivos(g).map(t=>`<li>${t}</li>`).join('')}</ul></div>
  <div class="bloco grafico"><h3>Preço na Steam nos últimos 3 anos (R$)</h3>${grafico(g)}
    <div class="legenda"><span><i style="border-color:#d2d2d2"></i>menor preço do mês</span><span><i style="border-color:#9a9a9a;border-top-style:dashed"></i>recorde (qualquer loja)</span><span><i style="border-color:#ff4757;border-top-style:dashed"></i>estimativa do inverno</span><span><i style="border-color:#d63031;border-top-width:6px;width:6px"></i>hoje</span></div></div>
  <div class="bloco"><h3>Detalhes</h3><table class="det">${det.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
    ${irm.length?`<tr><td>Da mesma franquia na lista</td><td><div class="irmaos">${irm.slice(0,12).map(x=>`<button data-a="${x.a}">${esc(x.n)}</button>`).join('')}</div></td></tr>`:''}</table></div>
  <div class="nav"><button class="ant" ${i>0?'':'disabled'}>← Anterior</button><span>${i+1} de ${vis.length}</span><button class="prox" ${i<vis.length-1?'':'disabled'}>Próximo →</button></div>`;
}
// ---------------------------------------------------- lista, filtros e navegação
let cesta='';
const T=M.tot;
$('#sub').textContent=`Venda de ${M.inicio} a ${M.fim}. ${M.n} jogos da sua lista, sem DLC e sem os que você já tem. Para cada um, uma ficha diz se você deve comprar ou não, e por quê.`;
function cestas(){
  $('#cestas').innerHTML=ORD.map(k=>{const t=T[k];const ex=k==='inverno'?`hoje ${brl0(t.hoje)} → <em>${brl0(t.inv)}</em><br>economia de <em>${brl0(t.hoje-t.inv)}</em>`:k==='ja'?`${brl0(t.hoje)} no total`:k==='mais'?`no inverno ${brl0(t.inv)}`:'avaliações abaixo de 70%';
    return `<button class="cesta vd-${k}" data-k="${k}" aria-pressed="${cesta===k}"><small>${VD[k][0]}</small><b>${t.n} jogos</b><span>${ex}</span></button>`}).join('');
}
$('#fr').innerHTML='<option value="">Todas as franquias</option>'+[...FR].filter(([,v])=>v.length>1).sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>`<option value="${esc(k)}">${esc(k)} (${v.length})</option>`).join('');
function lista(){
  const q=$('#busca').value.trim().toLowerCase(),fr=$('#fr').value,o=$('#ordem').value;
  vis=L.filter(g=>(!cesta||g.vd===cesta)&&(!fr||g.fr===fr)&&(!q||g.n.toLowerCase().includes(q)));
  if(o)vis.sort({eco:(a,b)=>b.eco-a.eco,wn:(a,b)=>a.wn-b.wn,rp:(a,b)=>(b.rp||0)*(b.rc>=300?1:.8)-(a.rp||0)*(a.rc>=300?1:.8),n:(a,b)=>a.n.localeCompare(b.n)}[o]);
  $('#lista').innerHTML=vis.map(g=>`<button class="it vd-${g.vd}" data-a="${g.a}"><span class="mini">${img(g,1)}</span><span class="in"><span class="nm">${esc(g.n)}</span>
    <span class="pr">${VD[g.vd][0]} · <b>${brl(g.vd==='ja'?g.ag:g.wn)}</b>${g.vd==='inverno'&&g.eco?` <i>−${brl(g.eco)}</i>`:''}</span></span></button>`).join('');
  $('#cont').textContent=vis.length+' jogo'+(vis.length===1?'':'s');
  abrir(vis[0]);
}
function abrir(g,rolar){
  if(!g){$('#ficha').innerHTML='<p style="padding:20px;color:#9a9a9a">Nenhum jogo com esses filtros.</p>';return}
  atual=g.a;$('#ficha').innerHTML=ficha(g);
  document.querySelectorAll('.it').forEach(b=>b.setAttribute('aria-current',+b.dataset.a===g.a));
  const b=document.querySelector(`.it[data-a="${g.a}"]`);if(b)b.scrollIntoView({block:'nearest'});
  if(rolar&&$('#ficha').getBoundingClientRect().top<0)$('#ficha').scrollIntoView({behavior:'smooth'});
}
const passo=d=>{const i=vis.findIndex(g=>g.a===atual)+d;if(i>=0&&i<vis.length)abrir(vis[i],1)};
$('#cestas').addEventListener('click',e=>{const b=e.target.closest('.cesta');if(b){cesta=cesta===b.dataset.k?'':b.dataset.k;cestas();lista();}});
$('#lista').addEventListener('click',e=>{const b=e.target.closest('.it');if(b)abrir(GA.get(+b.dataset.a),1)});
$('#ficha').addEventListener('click',e=>{if(e.target.closest('.ant'))passo(-1);else if(e.target.closest('.prox'))passo(1);
  else{const b=e.target.closest('.irmaos button');if(b){const g=GA.get(+b.dataset.a);if(!vis.includes(g)){cesta='';$('#fr').value=g.fr||'';$('#busca').value='';cestas();lista();}abrir(g,1);}}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();passo(1)}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();passo(-1)}});
['busca','fr','ordem'].forEach(id=>$('#'+id).addEventListener('input',lista));
$('#rodape').innerHTML=`<p><b>Como a estimativa é feita.</b> Pedido seu: todo jogo bate o recorde no inverno. O novo recorde fica de 5% a 20% abaixo do menor preço da história (lojas oficiais, com o preço cheio de hoje), e a ficha explica o tamanho do passo. Ele é maior quando o recorde ainda é um desconto raso, quando é antigo, quando o jogo é novo e quando o histórico já aponta recorde. Se o modelo de cortes da Steam previr um preço ainda menor, vale o menor. Lembrete honesto: pelo histórico, cerca de ${M.rec25.n?Math.round(100*M.rec25.real/M.rec25.n):30}% dos jogos bateram o recorde no inverno de 2025, então para os outros a estimativa é otimista. Cupom de loja não aparece no histórico; a keyshop entra com o preço de hoje. Fora da página: ${Object.entries(M.fora).map(([k,v])=>v+' '+k).join(', ')}. Gerado em ${M.gerado}.</p>`;
cestas();lista();
</script>
</body>
</html>
