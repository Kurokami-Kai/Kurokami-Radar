name: Gerar instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Versao
        shell: pwsh
        run: |
          $v = (Select-String -Path radar/__init__.py -Pattern 'VERSAO = "(.+)"').Matches[0].Groups[1].Value
          "RADAR_VERSAO=$v" >> $env:GITHUB_ENV
          Write-Host "Versao $v"

      - name: Icone
        run: python tools/gerar_icone.py

      - name: Executavel (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --name KurokamiRadar
          --icon assets/radar.ico
          --add-data "radar/painel.html;radar"
          --collect-submodules radar --collect-submodules keyring --collect-submodules pystray
          --hidden-import win32ctypes.core --hidden-import win32ctypes.pywin32
          radar.py

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: KurokamiRadar_Setup_v${{ env.RADAR_VERSAO }}
          path: output/*.exe

      - name: Publicar em Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.exe
