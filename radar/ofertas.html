<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofertas · Kurokami Hunter</title>
<style>

:root{--bg:#050505;--bg2:#000000;--pan:#0d0d0d;--pan2:#161616;--txt:#d2d2d2;--fraco:#979797;--dim:#666666;--azul:#66c0f4;--verde:#a4d007;--vbg:#4c6b22;--vtx:#beee11;--borda:#ffffff14;--lista:#c9a0ff;--tenho:#f0f0f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Motiva Sans",Arial,Helvetica,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:3px}
.esc{position:sticky;top:0;z-index:30;background:#000;border-bottom:1px solid var(--borda);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.esc b{color:#fff;font-weight:400;letter-spacing:.03em}
.seg{display:inline-flex;background:var(--pan);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;color:var(--fraco);padding:6px 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--azul);color:#000000}
.esc .desc{color:var(--fraco);font-size:12.5px;flex:1 1 380px}
.topbar{background:var(--bg2);position:sticky;top:44px;z-index:20}
.topbar .w{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:26px;height:56px}
.logo{color:#fff;font-size:15px;letter-spacing:.08em}.logo small{display:block;font-size:9px;color:var(--azul);letter-spacing:.3em}
.nav{display:flex;gap:4px;height:100%}
.nav>div,.nav>button{position:relative;display:flex;align-items:center}
.nav .t{background:none;border:0;color:#dcdedf;text-transform:uppercase;font-size:14px;letter-spacing:.04em;padding:0 12px;height:100%;cursor:pointer}
.nav .t.on{color:var(--azul);box-shadow:inset 0 -3px 0 var(--azul)}
.ddm{display:none;position:absolute;top:100%;left:0;min-width:250px;background:#1c1c1c;box-shadow:0 6px 18px #000a;padding:6px 0;z-index:40}
.nav>div:hover .ddm,.nav>div:focus-within .ddm{display:block}
.ddm button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:#dcdedf;padding:8px 16px;font-size:13.5px;cursor:pointer}
.ddm button:hover{background:#dcdedf;color:#000000}
.ddm button.on{color:var(--azul)}.ddm button.on:hover{color:#000000}
.ddm kbd{font-size:11px;opacity:.6}
.ddm hr{border:0;border-top:1px solid #ffffff22;margin:6px 0}
.ddm .ext{color:var(--fraco);font-size:12.5px}
main{max-width:1240px;margin:0 auto;padding:18px 44px 90px 16px;position:relative}
h2{font-size:22px;font-weight:400;color:#fff;margin:0}
.pcab{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:12px}
.pcab .res{color:var(--fraco);font-size:13px}.pcab .res b{color:#fff;font-weight:400}.pcab .res .g{color:var(--verde)}
.tool{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 18px;padding:8px 0;border-bottom:1px solid var(--borda);position:sticky;top:100px;z-index:10;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chips span{color:var(--dim);font-size:12px;margin-right:4px;text-transform:uppercase;letter-spacing:.05em}
.chips button{background:#ffffff0d;border:0;color:var(--fraco);padding:5px 11px;border-radius:2px;cursor:pointer;font-size:13px}
.chips button:hover{background:#ffffff1a;color:#fff}
.chips button[aria-pressed=true]{background:#3d3d3d;color:#fff}
.tool .sp{flex:1}
.tool input{background:#0d0d0d;border:0;box-shadow:inset 0 0 0 1px #333333;color:#fff;padding:6px 10px;border-radius:2px;font:inherit;font-size:13px;width:190px}
.views{display:inline-flex;gap:2px}
.views button{background:#0d0d0d;border:0;color:var(--fraco);padding:6px 10px;cursor:pointer;border-radius:2px;font-size:12.5px}
.views button[aria-pressed=true]{background:#3d3d3d;color:#fff}
.az{position:fixed;right:max(6px,calc(50vw - 640px));top:170px;bottom:56px;display:flex;flex-direction:column;justify-content:center;gap:1px;z-index:15}
.az button{background:none;border:0;color:var(--fraco);font-size:11px;width:24px;height:clamp(14px,2.6vh,22px);cursor:pointer;border-radius:2px;padding:0}
.az button:hover{background:var(--azul);color:#000000}
.az button:disabled{color:#ffffff1f;cursor:default;background:none}
.kb{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#000d;border-top:1px solid var(--borda);font-size:12px;color:var(--fraco);display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:6px 10px}
.kb kbd{background:#ffffff1a;color:#fff;border-radius:2px;padding:0 5px;font:inherit;font-size:11.5px;margin-right:4px}
/* capas */
.capa{position:relative;display:block;aspect-ratio:2/3;background:#0d0d0d;overflow:hidden;border:0;padding:0;cursor:pointer;width:100%}
.capa img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .15s,transform .2s}
.capa .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12px;color:#fff;background:linear-gradient(160deg,hsl(var(--h) 35% 28%),hsl(var(--h) 40% 12%))}
.capa.falta img,.capa.falta .ph{filter:grayscale(1) brightness(.55)}
.capa.falta:hover img,.capa.falta:focus-visible img{filter:grayscale(.2) brightness(.85)}
.capa .ok{position:absolute;top:6px;left:6px;background:var(--vbg);color:var(--vtx);font-size:11px;padding:1px 6px;border-radius:2px}
.capa .cor{position:absolute;top:6px;right:6px;color:var(--lista);font-size:15px;text-shadow:0 0 4px #000}
.capa .pr{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:4px;background:linear-gradient(transparent,#000d 40%);padding:16px 6px 6px;font-size:12.5px;color:#fff}
.capa .pr .c{background:var(--vbg);color:var(--vtx);font-size:11px;padding:0 4px;margin-right:4px}
.mais{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:0;border-radius:2px;background:linear-gradient(90deg,#75b022,#588a1b);color:#d2efa9;cursor:pointer;font-size:15px;line-height:1;flex:none}
.vit{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:26px 20px}
.it{min-width:0}
.pilha{position:relative;padding:8px 8px 0 0}
.pilha::before,.pilha::after{content:"";position:absolute;inset:8px 8px 0 0;background:#2a2a2a;border-radius:2px;transform:translate(8px,-8px);box-shadow:0 0 0 1px #ffffff10}
.pilha::after{background:#1f1f1f;transform:translate(4px,-4px)}
.pilha .capa{z-index:1;box-shadow:0 6px 16px #0009}
.it:hover .capa img,.it .capa:focus-visible img{transform:scale(1.035)}
.it .qt{position:absolute;z-index:2;left:6px;top:14px;background:#000c;color:#fff;font-size:12px;padding:2px 7px;border-radius:2px}
.it .qt.ok{background:var(--vbg);color:var(--vtx)}
.it .pb{position:absolute;z-index:2;left:0;right:8px;bottom:0;height:4px;background:#000a}.it .pb i{display:block;height:100%;background:var(--verde)}
.it .nm{color:#fff;margin-top:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sub{color:var(--fraco);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secao{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px;border-bottom:1px solid var(--borda);padding-bottom:6px}
.secao h3{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.08em;color:#fff;margin:0}
.secao span{color:var(--fraco);font-size:12.5px}
.bar{height:6px;background:#ffffff12;position:relative;margin:6px 0}.bar i{position:absolute;inset:0 auto 0 0;background:var(--verde)}
.btn{border:0;padding:0 16px;height:38px;border-radius:2px;cursor:pointer;background:#67c1f533;color:var(--azul);font-size:14px}
.btn.verde{background:linear-gradient(90deg,#75b022,#588a1b);color:#d2efa9}
.btn:hover{filter:brightness(1.15)}
.pct{background:var(--vbg);color:var(--vtx);padding:1px 5px;font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:14px}
/* prateleira de franquia (2 por linha) */
.prat{background:var(--pan);padding:12px 14px 14px;min-width:0;cursor:pointer;border-left:3px solid transparent}
.prat:hover{border-left-color:var(--azul);background:#141414}
.prat .cab{display:flex;align-items:center;gap:10px}
.prat .cab h3{font-size:16px;font-weight:400;color:#fff;margin:0;flex:1;min-width:0}
.prat .cab h3 button{background:none;border:0;padding:0;cursor:pointer;color:#fff;font-size:16px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.prat .cab small{color:var(--fraco);font-size:12.5px;white-space:nowrap}
.fil{position:relative}
.fil .trilho{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none}
.fil .trilho::-webkit-scrollbar{display:none}
.fil .trilho>div{flex:0 0 var(--cw,104px);min-width:0}
.fil .seta{position:absolute;top:0;bottom:var(--sb,20px);width:32px;border:0;background:#000b;color:#fff;font-size:24px;cursor:pointer;z-index:2}
.fil .seta.e{left:0}.fil .seta.d{right:0}
.ano{font-size:11.5px;color:var(--dim);text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* texto simétrico: todos os blocos com a mesma altura */
.tgrid{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:14px}
.tc{background:var(--pan);padding:14px 16px 10px;display:flex;flex-direction:column;min-width:0}
.tc h3{font-size:15px;font-weight:400;color:#fff;margin:0;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tc h3 button{background:none;border:0;padding:0;color:#fff;font-size:15px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tc h3 small{color:var(--fraco);font-size:12.5px;white-space:nowrap}
.tc .sub{font-size:12.5px;color:var(--fraco);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst{list-style:none;margin:6px 0 0;padding:0;font-size:13px;flex:1}
.lst li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;height:30px;border-bottom:1px solid #ffffff08}
.lst li.vz{border-color:transparent}
.lst .n{color:var(--tenho);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .n.f{color:var(--lista)}
.lst .n .a{color:var(--dim);font-size:11.5px;margin-left:6px}
.lst .s{white-space:nowrap;color:#9ccc54;font-size:12.5px;display:flex;gap:6px;align-items:center}.lst .s.f{color:#fff}
.lstd li{grid-template-columns:52px minmax(0,1fr) auto}
.lstd img{width:52px;height:24px;object-fit:cover;display:block;filter:grayscale(1) brightness(.75)}
.rod{background:none;border:0;border-top:1px solid var(--borda);color:var(--azul);text-align:left;padding:8px 0 0;margin-top:6px;cursor:pointer;font-size:12.5px}
.rod:hover{color:#fff}
.leg2{display:flex;gap:16px;font-size:12px;color:var(--fraco);margin:-6px 0 14px}.leg2 i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.avt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.avt button{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center;background:var(--pan);border:0;padding:6px;cursor:pointer;text-align:left;min-width:0}
.avt button:hover{background:#151515}
.avt img{width:92px;height:43px;object-fit:cover;display:block}
.avt .nm{color:var(--tenho);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avt .sb{color:var(--fraco);font-size:12px}
/* Completar */
.cp{background:var(--pan);padding:12px;display:grid;grid-template-columns:var(--cw,80px) minmax(0,1fr);gap:12px;align-items:start;min-width:0;cursor:pointer;border-left:3px solid transparent;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.cp:hover{border-left-color:var(--azul);background:#141414}
.cp .capa{cursor:inherit}
.cp .nm{color:#fff;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp .sub{color:var(--fraco);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cp .sub b{color:#fff;font-weight:400}
.dg{display:grid;grid-template-columns:repeat(var(--dc,3),minmax(0,1fr));gap:6px;margin-top:8px}
.dl{background:#0a0a0a;min-width:0;cursor:pointer;display:block}
.dl .im{position:relative;aspect-ratio:460/215;background:#0d0d0d;overflow:hidden}
.dl .im img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) brightness(.6);transition:filter .15s}
.dl:hover .im img{filter:none}
.dl .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;text-align:center;padding:4px;background:linear-gradient(160deg,hsl(var(--h) 30% 26%),hsl(var(--h) 30% 12%));filter:grayscale(1) brightness(.7)}
.dl .b{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:4px 5px;font-size:11.5px}
.dl .im .c{position:absolute;left:4px;top:4px;z-index:1}
.dl .nm2{font-size:12.5px;color:var(--txt);padding:5px 6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.dl .mn{font-size:11.5px;color:var(--fraco);padding:0 6px}
.dlmais{display:flex;align-items:center;justify-content:center;background:#ffffff0a;color:var(--azul);font-size:12.5px;min-height:40px}
/* tela cheia */
.ov{position:fixed;inset:0;z-index:60;background:#000d;overflow-y:auto;padding:24px 16px 50px}
.fx{max-width:1200px;margin:0 auto;position:relative;background:var(--bg);box-shadow:0 0 40px #000}
.fx .fundo{position:absolute;inset:0 0 auto 0;height:560px;background:#0d0d0d center top/cover;opacity:.4;overflow:hidden}
.fx .fundo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#05050540 0,#050505 100%)}
.fx .x{position:absolute;top:12px;right:12px;z-index:5;width:36px;height:36px;border:0;background:#000a;color:#fff;font-size:18px;cursor:pointer}
.fx .nav2{position:fixed;top:45%;z-index:65;width:40px;height:70px;border:0;background:#000b;color:#fff;font-size:28px;cursor:pointer}
.fx .nav2.e{left:max(4px,calc(50vw - 650px))}.fx .nav2.d{right:max(4px,calc(50vw - 650px))}
.fx .in{position:relative;padding:28px 36px 26px}
.fx .top{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px}
.fx .top .capa{box-shadow:0 10px 30px #000c;cursor:default}
.fx h1{font-size:34px;font-weight:400;color:#fff;margin:4px 0 6px;line-height:1.15;text-shadow:0 2px 8px #000}
.chip{display:inline-block;font-size:12.5px;padding:3px 9px;border-radius:2px;background:#ffffff14;color:var(--txt);margin:0 6px 6px 0}
.chip.tenho{background:var(--vbg);color:var(--vtx)}.chip.lista{background:#4b3a6e;color:#e4d7ff}.chip.promo{background:#1a6fd1;color:#fff}
.fx .dsc{color:var(--txt);font-size:14px;margin:4px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:12px}
.tiles>div{background:#0d0d0dd9;padding:10px 12px;border-top:3px solid transparent;min-width:0}
.tiles>div.d{border-top-color:var(--verde)}
.tiles .k{color:var(--fraco);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tiles .v{color:#fff;font-size:22px;line-height:1.25;white-space:nowrap}.tiles .v.g{color:var(--vtx)}
.tiles .s{color:var(--fraco);font-size:12px;line-height:1.3;margin-top:2px}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.fx h4{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.08em;color:#fff;margin:22px 0 10px;display:flex;align-items:center;gap:14px}
.fx h4 span{color:var(--fraco);text-transform:none;letter-spacing:0;font-size:13px}
.fx h4 .bar{width:180px;margin:0}
.lg{font-size:12px;margin-top:4px;line-height:1.35}
.lg .n{color:var(--tenho);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.lg .n.f{color:var(--lista)}
.lg .a{color:var(--dim)}.lg .a b{color:#9ccc54;font-weight:400}.lg .a b.f{color:#fff}
.cx{background:var(--pan);padding:12px 14px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:2px 10px;font-size:13px;align-items:center}
.hb span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .b{grid-column:1/-1;height:4px;background:#ffffff10;margin-bottom:6px}.hb .b i{display:block;height:100%;background:var(--azul)}
.hb .t{text-align:right;color:var(--fraco)}
.tag{display:inline-block;background:#ffffff10;padding:3px 8px;margin:0 6px 6px 0;font-size:12.5px;cursor:pointer;border-radius:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.tag:hover{background:#ffffff22}
.fl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:5px 0;border-bottom:1px solid #ffffff0a;font-size:13px;align-items:center}
.fl .n{color:var(--lista);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .p{display:flex;gap:6px;align-items:center;white-space:nowrap}
.vazio{color:var(--fraco);font-size:13px}
/* F: uma tela só */
.tres{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:14px}
.tres h4{margin-top:18px}
/* G: painel ao lado */
.fxG{display:grid;grid-template-columns:minmax(0,1fr) 330px}
.fxG .lat{position:relative;align-self:stretch;background:#0d0d0df2;border-left:1px solid var(--borda);z-index:2}
.fxG .lat .gruda{position:sticky;top:-24px;padding:22px 20px 24px}
.fxG .lat h4{margin:16px 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;align-items:baseline}
.kv dt{color:var(--fraco);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.kv dd{margin:0;color:#fff;text-align:right}.kv dd.g{color:var(--vtx)}
.kv dd small{display:block;color:var(--fraco);font-size:11.5px}
.fgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px 10px}
/* ficha de completar */
.dgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.faixa{position:relative;background:#0d0d0df2;border-top:1px solid var(--borda);display:grid;grid-template-columns:270px repeat(3,minmax(0,1fr));margin-top:20px}
.faixa>div{padding:14px 20px 18px;border-left:1px solid var(--borda);min-width:0}
.faixa .kv{gap:1px 14px}.faixa .kv dd small{display:inline;margin-left:6px}.faixa .kv dt,.faixa .kv dd{line-height:1.9}.faixa>div:first-child{border-left:0}
.fx .faixa h4{margin:0 0 12px}
.fil .trilho.arr{cursor:grab;user-select:none;scroll-behavior:auto;--fe:0px;--fd:56px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fe),#000 calc(100% - var(--fd)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--fe),#000 calc(100% - var(--fd)),transparent 100%)}
.fil .trilho.arr .capa{cursor:inherit}
.fil .trilho.puxando{cursor:grabbing}
.ban{position:relative;width:100%;aspect-ratio:1920/620;max-height:260px;overflow:hidden;background:#0d0d0d}
.ban>img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#050505d9 78%,#050505)}
.banin{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 36px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.banin h1{margin:2px 0}.banin .dsc{margin:0}
.fundo2{position:absolute;left:0;right:0;top:0;aspect-ratio:1920/620;background:center top/100% auto no-repeat;opacity:.35}
.fundo2::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#05050530,#050505)}
.top2{display:grid;grid-template-columns:340px minmax(0,1fr);gap:26px;align-items:center;position:relative}
.hcap{width:100%;aspect-ratio:460/215;object-fit:cover;box-shadow:0 10px 30px #000c;display:block}
.fx h4 .bar{flex:1;width:auto;margin:0}
.fx .trilho.arr{justify-content:safe center}
.fx .trilho.arr>div{flex:1 1 0;min-width:var(--cw);max-width:156px}

<script>
const D=/*DADOS*/{};
const CDN='https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=c=>c==null?'—':c===0?'Grátis':'R$ '+(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl0=c=>'R$ '+Math.round((c||0)/100).toLocaleString('pt-BR');
const fmtN=n=>(n||0).toLocaleString('pt-BR');
const ano=t=>t?new Date(t*1000).getFullYear():'em breve';
const hue=id=>(id*47)%360;
const u=s=>s&&s[0]==='~'?CDN+s.slice(1):s;
const letra=n=>{const c=n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^(the|a)\s+/i,'').charAt(0).toUpperCase();return /[A-Z]/.test(c)?c:'#';};
const chave=n=>n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^(the|a)\s+/i,'').toLowerCase();
const AGORA=Date.now()/1000;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900);}
document.addEventListener('error',e=>{const im=e.target;if(im.tagName!=='IMG'||im.dataset.n==null)return;
  if(im.dataset.alt){const a=im.dataset.alt;im.removeAttribute('data-alt');im.src=a;im.style.objectFit='contain';return;}
  im.outerHTML=`<span class="ph" style="--h:${hue(+im.dataset.i)}">${esc(im.dataset.n)}</span>`;},true);

/* ---------- dados ---------- */
const M=r=>({appid:r[0],nome:r[1],cv:u(r[2]),cap:u(r[3]),preco:r[4],cheio:r[5],corte:r[6],t:r[7],pr:r[8],prq:r[9],volta:r[10],rpos:r[11],rcount:r[12],
  fim:r[13],lanc:r[14],breve:r[15],loja:r[16],lista:r[17],carr:r[18],fr:r[20],motivo:r[24],dica:r[25],tipo:r[26]||'jogo',tenho:r[27],hist:r[28],pv:r[29]||{},k:chave(r[1]),L:letra(r[1])});
const L=D.L.map(M);L.forEach(o=>o.lista=1);
const LID=new Map(L.map(o=>[o.appid,o]));
const P=D.P.map(r=>typeof r==='number'?LID.get(r):M(r)).filter(Boolean);
const PS=P.filter(o=>!o.lista);
const em=o=>o.corte>0&&o.preco!=null;
const gratis=o=>o.preco===0&&o.cheio>0;
const REC=['selo','novo','igual','24m'];
/* ---------- a métrica: chance de perder (o preço não voltar em 3 meses), medida no backtest ---------- */
[...L,...PS].forEach(o=>{const v=o.pv;o.risco=em(o)?v.risco??null:null;o.espera=v.espera??null;o.k24=v.k24;o.eco=em(o)?(o.cheio||0)-o.preco:0;
  o.vale=o.risco!=null&&REC.includes(o.t)&&o.risco>=.2&&(o.corte>=40||o.t==='selo');o.eleg=o.vale&&!!o.hist&&o.eco>=1000;});
const fimK=o=>o.fim&&o.fim>AGORA?o.fim:9e12;
const proxK=o=>o.pv.prox_t||9e12;
const SORT={melhor:(a,b)=>(b.risco??-1)-(a.risco??-1)||b.corte-a.corte||b.eco-a.eco,desc:(a,b)=>b.corte-a.corte||b.eco-a.eco,
  barato:(a,b)=>(a.preco??9e9)-(b.preco??9e9)||a.k.localeCompare(b.k,'pt-BR'),fim:(a,b)=>fimK(a)-fimK(b)||(b.risco??-1)-(a.risco??-1),
  prox:(a,b)=>proxK(a)-proxK(b)||a.k.localeCompare(b.k,'pt-BR'),aval:(a,b)=>notaB(b)-notaB(a)||b.corte-a.corte,az:(a,b)=>a.k.localeCompare(b.k,'pt-BR')};
const tempo=d=>d<10?'poucos dias':d<45?`~${Math.max(2,Math.round(d/7))} semanas`:`~${Math.max(2,Math.round(d/30.4))} meses`;

/* ---------- etiquetas ---------- */
const ET={selo:['Selo Kurokami','#5c4a12','#ffd75e'],novo:['Novo recorde','#4c6b22','#beee11'],igual:['Igual ao recorde','#1a4a6b','#66c0f4'],'24m':['Menor em 2 anos','#262626','#c8c8c8'],
  gratis:['Grátis para resgatar','#3a3a3a','#f0f0f0'],fim:['','#6b3a12','#ffb36b'],rara:['','#1f4f4a','#6fe0c8'],volta:['','#2a2a2a','#979797'],info:['','#2a2a2a','#979797']};
const etqP=o=>gratis(o)?['Grátis para resgatar','gratis']:em(o)&&ET[o.t]?[ET[o.t][0],o.t]:null;
function etqC(o){if(!em(o)||o.risco==null)return null;
  if(o.vale&&o.fim>AGORA&&o.fim-AGORA<=48*3600){const h=(o.fim-AGORA)/3600;return [new Date(o.fim*1000).toDateString()===new Date().toDateString()?'Termina hoje':`Termina em ${Math.max(1,Math.round(h))} h`,'fim'];}
  if(o.risco>=.4)return ['Pode não voltar tão cedo','rara'];
  if(!o.k24&&o.risco>=.2)return ['1ª vez nesse preço em 2 anos','rara'];
  return o.espera?['Volta em '+tempo(o.espera),'volta']:null;}
const pill=(e,cls='')=>e?`<span class="et ${cls}" style="--eb:${ET[e[1]][1]};--ec:${ET[e[1]][2]}">${esc(e[0])}</span>`:'';
function etqFicha(o){const p=etqP(o),c=VD[verd(o)[0]];return (p?pill(p,'chip'):'')+`<span class="et chip" style="--eb:${c[1]};--ec:${c[2]}">${c[0]}</span>`;}
const fimTxt=t=>{if(!t)return '';const h=(t-AGORA)/3600;if(h<=0)return '';const d=Math.round(h/24);return h<24?`termina em ${Math.max(1,Math.round(h))} h`:`termina em ${d} dia${d>1?'s':''}`;};
const breve=o=>o.fim&&o.fim-AGORA<3*86400&&o.fim>AGORA;
const EV=(()=>{const c={},dia=t=>new Date(t*1000).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});P.forEach(o=>{if(o.fim)c[dia(o.fim)]=(c[dia(o.fim)]||0)+1;});
  const [d,n]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]||['',0];return n>=300?{d,n}:null;})();
const EVN=(()=>{const t=(D.EV||[]).slice(-1)[0];if(!t||AGORA-t>40*86400)return 'Evento da Steam';const m=new Date(t*1000).getMonth()+1;
  return 'Promoção de '+(m===12||m===1?'Inverno':m<=4?'Primavera':m<=7?'Verão':'Outono')+' da Steam';})();
const GR={};L.forEach(o=>{const k=(o.fr||o.nome).toLowerCase();(GR[k]=GR[k]||{nome:o.fr||o.nome,m:[]}).m.push(o);});
const FRL=Object.values(GR).map(g=>{const m=g.m.sort((a,b)=>(a.lanc||9e9)-(b.lanc||9e9)),pm=m.filter(em);
  return {k:m.length>1?'fr':'jogo',nome:g.nome,m,pm,hoje:pm.reduce((s,o)=>s+(o.preco||0),0),tudo:m.reduce((s,o)=>s+(o.preco||0),0),kk:chave(g.nome),L:letra(g.nome)};});

/* ---------- estado e filtros ---------- */
const PADRAO={promo:{desc:50,an:500,tipo:'jogo',tenho:'esconder',lista:'',ate:0,nota:0,tp:[]},lista:{ver:'todos',desc:50,an:500,tipo:'jogo',tenho:'esconder',tp:[]}};
const novoF=k=>({...PADRAO[k],tp:new Set()});
const S={rec:{promo:'tudo',lista:'todos'},orc:10000,teto:2500,mod:'A',pop:false,selJ:null,selA:null,nota:false,sub:'dest',modo:{},q:'',ord:{},h:0,lim:120,aberto:null,lista:[],f:{promo:novoF('promo'),lista:novoF('lista')}};
const SUBS=[['dest','Destaques','1'],['promo','Promoções','2'],['lista','Lista de desejos','3']];
const modo=()=>S.modo[S.sub]||'jogos';
const ORD={promo:[['melhor','Melhores'],['desc','Maior desconto'],['barato','Menor preço'],['aval','Mais bem avaliados'],['fim','Termina antes']],
  lista:[['melhor','Melhores'],['desc','Maior desconto'],['barato','Menor preço'],['fim','Termina antes'],['prox','Próxima promoção'],['az','A–Z']]};
const ordem=()=>{const k=S.sub,o=S.ord[k],l=ORD[k];return l.some(x=>x[0]===o)?o:l[0][0];};
const reg=x=>{S.lista.push(x);return S.lista.length-1;};
const VAZIO={desc:0,an:0,tipo:'',tenho:'mostrar',lista:'',ate:0,nota:0};
const NOMES={desc:v=>`Desconto -${v}% ou mais`,an:v=>`${fmtN(v)}+ análises`,tipo:v=>v==='jogo'?'Só jogos':v==='dlc'?'Só DLCs':'Só outros',tenho:()=>'Sem os que você tem',lista:v=>v==='so'?'Só da sua lista':'Fora da sua lista',ate:v=>'Até '+brl0(v),nota:v=>v+'%+ positivas'};
function passa(o,f,pg){
  if(S.q&&!o.nome.toLowerCase().includes(S.q))return false;
  if(f.tipo&&(f.tipo==='outros'?['jogo','dlc'].includes(o.tipo):o.tipo!==f.tipo))return false;
  if(f.tenho==='esconder'&&o.tenho)return false;
  if(f.an&&o.rcount<f.an)return false;
  if(pg==='promo'&&f.lista&&(f.lista==='so'?!o.lista:o.lista))return false;
  if(f.ate&&(o.preco==null||o.preco>f.ate))return false;
  if(f.nota&&(o.rpos||0)<f.nota)return false;
  if(em(o)){if(f.desc&&o.corte<f.desc)return false;if(f.tp.size&&!f.tp.has(gratis(o)?'gratis':o.t))return false;}
  else if(pg==='promo'||f.tp.size)return false;
  return true;}
function barraFiltros(pg){const f=S.f[pg],at=[];
  for(const k of ['desc','an','tipo','tenho','lista','ate','nota'])if(k in f&&f[k]!==VAZIO[k])at.push([k,NOMES[k](f[k])]);
  f.tp.forEach(t=>at.push(['tp:'+t,ET[t][0]]));
  if(S.q)at.push(['q',`“${S.q}”`]);
  const g=(nome,k,ops)=>`<div class="chips"><span>${nome}</span>${ops.map(([v,t])=>`<button data-fk="${k}" data-fv="${v}" aria-pressed="${String(f[k])===String(v)}">${t}</button>`).join('')}</div>`;
  return `<div class="fpop"${S.pop?'':' hidden'}><div class="fbar"><span>Ligados</span>${at.length?at.map(([k,t])=>`<button class="pil" data-tira="${k}" title="Tirar este filtro">${esc(t)}<i>✕</i></button>`).join('')+`<button class="limpa" data-limpa>Limpar tudo</button>`:'<span class="nada">nenhum: mostrando tudo</span>'}
    ${JSON.stringify([...f.tp])!=='[]'||Object.keys(VAZIO).some(k=>k in f&&f[k]!==PADRAO[pg][k])?'<button class="limpa" data-padrao>Voltar ao padrão</button>':''}</div>
   <div class="grupos">${g('Desconto','desc',[[0,'Todos'],[50,'-50%'],[75,'-75%'],[90,'-90%']])}${g('Análises','an',[[0,'Todas'],[500,'500+'],[5000,'5 mil+'],[50000,'50 mil+']])}
    ${g('Tipo','tipo',[['','Tudo'],['jogo','Jogos'],['dlc','DLCs'],['outros','Outros']])}${g('Você tem','tenho',[['mostrar','Mostrar'],['esconder','Esconder']])}
    ${pg==='promo'?g('Lista','lista',[['','Tanto faz'],['so','♥ Só da lista'],['sem','Fora da lista']])+g('Preço','ate',[[0,'Todos'],[1000,'até R$ 10'],[2500,'até R$ 25'],[5000,'até R$ 50']])+g('Avaliação','nota',[[0,'Todas'],[85,'85%+'],[95,'95%+']]):''}
    <div class="chips"><span>Etiquetas</span>${[...REC,'gratis'].map(t=>`<button data-tp="${t}" style="--eb:${ET[t][1]};--ec:${ET[t][2]}" aria-pressed="${f.tp.has(t)}">${ET[t][0]}</button>`).join('')}</div></div></div>`;}

/* ---------- peças ---------- */
const imgV=o=>`<img src="${esc(o.cv||CDN+o.appid+'/library_600x900_2x.jpg')}" alt="" loading="lazy" data-n="${esc(o.nome)}" data-i="${o.appid}"${o.cap?` data-alt="${esc(o.cap)}"`:''}>`;
const imgH=(o,c)=>`<img${c?` class="${c}"`:''} src="${esc(o.cap||CDN+o.appid+'/header.jpg')}" alt="" loading="lazy" data-n="${esc(o.nome)}" data-i="${o.appid}">`;
const riscoCor=r=>r>=.4?'#ffd75e':r>=.2?'#6fe0c8':'#979797';
const nbx=o=>S.nota&&o.risco!=null?`<span class="nb" style="--c:${riscoCor(o.risco)}" title="Chance de o preço não voltar em 3 meses · espera prevista">${Math.round(o.risco*100)}% · ${o.espera??'?'}d</span>`:'';
const precoTxt=o=>o.preco==null?(o.breve?'em breve':'sem preço'):brl(o.preco);
function ctxLin(o){const c=etqC(o);if(c)return pill(c);
  if(!em(o))return o.pv.prox_curto?`<span>próxima: ${esc(o.pv.prox_curto)}</span>`:`<span class="dim">${o.breve?'em breve':'sem previsão'}</span>`;
  return o.hist?'':'<span class="dim">sem histórico ainda</span>';}
const subLin=o=>em(o)?[o.eco>0?'economia '+brl0(o.eco):'',(etqC(o)||[])[1]!=='fim'?fimTxt(o.fim):''].filter(Boolean).join(' · '):o.pv.menor?'menor que já teve: '+brl(o.pv.menor[0]):'';
function capaV(o,j,op={}){const p=etqP(o);

/* as 2 frases: quando vem a próxima (e por quanto) e, se está em promoção, se esse preço costuma voltar */
const conf10=v=>{const m=((v.prox1||'')+' '+(v.prox2||'')).match(/(quase 10|\d+) de 10/);return m?m[1]:null;};

function pinta(){const x=OV[S.aberto],keep=S.lista;S.lista=OV;const h=x.k==='prat'?fichaPrat(x.x):x.k==='fr'?fichaFR(x):fichaJ(x.k==='jogo'&&x.m?x.m[0]:x.o);
  $('#ov').innerHTML=`<div class="ov" data-ov>${h}</div>`;S.lista=keep;
  document.body.style.overflow='hidden';$('#ov .ov').scrollTop=0;setas();kb();$('#ov [data-fecha]').focus({preventScroll:true});}
function fecha(){$('#ov').innerHTML='';document.body.style.overflow='';S.aberto=null;kb();}
const kind=y=>y.k==='prat'?'prat':y.k==='fr'?'fr':'jogo';
function passo(d){const n=OV.length,ab=OV[S.aberto],k0=kind(ab);let i=S.aberto;
  for(let c=0;c<n;c++){i=(i+d+n)%n;const y=OV[i];if(kind(y)===k0&&(k0!=='jogo'||y.o!==ab.o))break;}
  S.aberto=i;pinta();}
function vai(go){if(S.aberto!=null)fecha();S.q='';S.lim=120;const [g,sec]=go.split(':');
  if(g==='lista'){S.sub='lista';S.rec.lista='promo';S.ord.lista='melhor';S.modo.lista='jogos';desenha();scrollTo(0,0);return;}
  else if(g==='fim'){S.sub='promo';S.ord.promo='fim';}
  else if(g==='baratos'){S.sub='promo';S.ord.promo='melhor';S.f.promo=novoF('promo');S.f.promo.lista='sem';S.teto=+sec;S.rec.promo='baratos';desenha();scrollTo(0,0);return;}
  else{S.sub='promo';S.ord.promo='melhor';S.f.promo.lista='sem';S.rec.promo=REC_P.some(x=>x[0]===sec)?sec:'tudo';desenha();scrollTo(0,0);return;}
  desenha();const a=sec&&$('#sec-'+sec);scrollTo(0,a?a.getBoundingClientRect().top+scrollY-110:0);}
function tira(k){const pg=S.sub==='lista'?'lista':'promo',f=S.f[pg];
  if(k==='q')S.q='';else if(k.startsWith('tp:'))f.tp.delete(k.slice(3));else f[k]=VAZIO[k];S.lim=120;desenha();}

/* ---------- teclado ---------- */
function navs(){return $$('#main [data-nav]').filter(e=>e.offsetParent);}
function andar(dir){const l=navs();if(!l.length)return;const a=document.activeElement;let i=l.indexOf(a);
  if(i<0){l[0].focus();return;}
  if(dir==='l'||dir==='r'){const j=i+(dir==='r'?1:-1);if(l[j]){l[j].focus({preventScroll:true});ver(l[j]);}return;}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2;let best=null,bd=1e9;
  for(const e of l){const q=e.getBoundingClientRect();const dy=dir==='d'?q.top-r.bottom:r.top-q.bottom;if(dy<-2)continue;const d=dy*3+Math.abs(q.left+q.width/2-cx);if(d<bd){bd=d;best=e;}}
  if(best){best.focus({preventScroll:true});ver(best);}}
function ver(e){const t=e.getBoundingClientRect();if(t.top<120)scrollBy(0,t.top-140);else if(t.bottom>innerHeight-50)scrollBy(0,t.bottom-innerHeight+70);
  const tr=e.closest('.trilho');if(tr){const a=e.getBoundingClientRect(),b=tr.getBoundingClientRect();if(a.left<b.left||a.right>b.right)tr.scrollLeft+=a.left-b.left-40;}}
function pular(Lt){const e=$(`#main [data-L="${Lt}"]`);if(!e){toast('Nada com '+Lt);return;}
  const alvo=e.matches('[data-nav]')?e:e.querySelector('[data-nav]')||e;window.scrollTo({top:e.getBoundingClientRect().top+scrollY-130});alvo.focus&&alvo.focus({preventScroll:true});}
document.addEventListener('keydown',e=>{
  const tg=e.target,digitando=tg.tagName==='INPUT'&&tg.type!=='checkbox';
  if(e.key==='Escape'){if(S.pop){fechaPop();return;}if(digitando){tg.blur();return;}if(S.aberto!=null){fecha();e.preventDefault();}return;}
  if(digitando||e.ctrlKey||e.altKey||e.metaKey)return;
  if($('#ov .ov')){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){passo(e.key==='ArrowRight'?1:-1);e.preventDefault();}return;}
  if(e.key==='Backspace'&&S.sub!=='dest'){const p=$$('.pil');if(p.length){tira(p[p.length-1].dataset.tira);e.preventDefault();}return;}
  const m={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[e.key];
  if(m){andar(m);e.preventDefault();return;}
  if(e.key==='Enter'&&tg.matches('[data-j]')){e.preventDefault();abre(+tg.dataset.j);return;}
  if(e.key==='/'){e.preventDefault();const q=$('#q');q&&q.focus();return;}
  if(['1','2','3'].includes(e.key)){S.sub=SUBS[+e.key-1][0];S.q='';S.lim=120;desenha();scrollTo(0,0);return;}
  if((e.key==='t'||e.key==='T')&&S.sub==='lista'){S.modo.lista=modo()==='jogos'?'franquias':'jogos';desenha();return;}
  if(/^[a-z]$/i.test(e.key)&&S.sub!=='dest'){pular(e.key.toUpperCase());return;}
});

/* ---------- cliques ---------- */
document.addEventListener('click',e=>{const x=e.target;let b;const pg=S.sub==='lista'?'lista':'promo';
  if(x.matches('[data-ov]')){fecha();return;}
  if(b=x.closest('[data-hp]')){S.h+=+b.dataset.hp;const y=scrollY;desenha();scrollTo(0,y);return;}
  if(b=x.closest('[data-pop]')){S.pop=!S.pop;const p=$('.fpop');if(p)p.hidden=!S.pop;b.setAttribute('aria-expanded',S.pop);return;}
  if(S.pop&&!x.closest('.fpop'))fechaPop();
  if(b=x.closest('[data-sec]')){S.lim=5000;desenha();const a=$('#sec-'+b.dataset.sec);if(a)scrollTo(0,a.getBoundingClientRect().top+scrollY-110);return;}
  if(b=x.closest('[data-sub]')){S.sub=b.dataset.sub;S.q='';S.lim=120;desenha();b.blur();scrollTo(0,0);return;}
  if(b=x.closest('[data-mais]')){e.stopPropagation();maisCarr(b);return;}
  if(b=x.closest('[data-loja]')){e.stopPropagation();if(PAI)PAI.loja(+b.dataset.loja);else open('https://store.steampowered.com/app/'+b.dataset.loja+'/','_blank');return;}
  if(x.closest('[data-bib]')){if(PAI)PAI.aba('bib');return;}
  if(b=x.closest('[data-teto]')){S.teto=+b.dataset.teto;const y=scrollY;desenha();scrollTo(0,y);return;}
  if(b=x.closest('[data-go]')){vai(b.dataset.go);return;}
  if(b=x.closest('[data-h]')){S.h=+b.dataset.h;const y=scrollY;desenha();scrollTo(0,y);return;}
  if(b=x.closest('[data-tira]')){tira(b.dataset.tira);return;}
  if(x.closest('[data-limpa]')){const f=S.f[pg];Object.keys(VAZIO).forEach(k=>{if(k in f)f[k]=VAZIO[k];});f.tp.clear();S.q='';S.lim=120;desenha();return;}
  if(x.closest('[data-padrao]')){const ver=S.f[pg].ver;S.f[pg]=novoF(pg);if(ver)S.f[pg].ver=ver;S.lim=120;desenha();return;}
  if(b=x.closest('[data-fk]')){const f=S.f[pg],k=b.dataset.fk,v=b.dataset.fv;f[k]=['desc','an','ate','nota'].includes(k)?+v:v;S.lim=120;desenha();return;}
  if(b=x.closest('[data-modo]')){S.modo[S.sub]=b.dataset.modo;S.lim=120;desenha();return;}
  if(b=x.closest('[data-ord]')){S.ord[S.sub]=b.dataset.ord;S.lim=120;desenha();return;}
  if(b=x.closest('[data-tp]')){const f=S.f[pg],t=b.dataset.tp;f.tp.has(t)?f.tp.delete(t):f.tp.add(t);S.lim=120;desenha();return;}
  if(b=x.closest('[data-rec]')){const pg=S.sub,v=b.dataset.rec,base=pg==='lista'?'todos':'tudo';S.rec[pg]=S.rec[pg]===v&&v!==base?base:v;S.ord[pg]='melhor';S.lim=120;const y=scrollY;desenha();scrollTo(0,y);return;}
  if(b=x.closest('[data-orc]')){S.orc=+b.dataset.orc;const y=scrollY;desenha();scrollTo(0,y);return;}
  if(b=x.closest('[data-az]')){if(ordem()!=='az'&&S.sub==='lista'){S.ord[S.sub]='az';desenha();}pular(b.dataset.az);return;}
  if(b=x.closest('[data-acao]')){toast(b.dataset.acao+' (amostra)');return;}
  if(x.closest('[data-fecha]')){fecha();return;}
  if(b=x.closest('[data-passo]')){passo(+b.dataset.passo);return;}
  if(x.closest('#ov')&&(b=x.closest('[data-j]'))){const y=OV[+b.dataset.j];if(y){if(PAI&&ehJogo(y))fichaPai(OV,+b.dataset.j);else{S.aberto=+b.dataset.j;pinta();}}return;}
  if(b=x.closest('#main [data-j]')){abre(+b.dataset.j);return;}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value.trim().toLowerCase();S.lim=120;const p=e.target.selectionStart;desenha();const n=$('#q');n.focus();n.setSelectionRange(p,p);}});
addEventListener('scroll',()=>{const m=$('#maisL');if(m&&m.getBoundingClientRect().top<innerHeight+400){S.lim+=120;const y=scrollY;desenha();scrollTo(0,y);}},{passive:true});
/* =================== sexta rodada: Destaques A ajustado, Promoções e Lista no molde da Biblioteca =================== */
const MODS={A:['A','Ficha e banner em 2 frases curtas (o resto em "por quê"); Promoções e Lista abrem com recortes em cartões, sem título; a Lista ganha o orçamento: com R$ X, quais jogos levar.']};
S.mod='A';
const ROT_M={A:'Melhores'};
const T0=Date.parse(D.quando)/1000,DIA=86400,HH=D.H||{};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],
  MESN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesAno=t=>{const d=new Date(t*1000);return MESES[d.getMonth()]+'/'+String(d.getFullYear()).slice(2);};
const parteMes=t=>{const d=new Date(t*1000),n=d.getDate();return (n<=10?'início':n<=20?'meados':'fim')+' de '+MESN[d.getMonth()];};
const ddmm=t=>new Date(t*1000).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const fimDoDia=t=>{const d=new Date(t*1000);d.setHours(23,59,59,0);return d.getTime()/1000;};
const tolP=p=>Math.max(10,p*.01);
const HI=o=>(HH[o.appid]||[]).map(([d,du,p,c])=>({t:T0+d*DIA,f:T0+(d+du)*DIA,p,c}));
const refP=o=>em(o)?o.preco:o.pv.menor?o.pv.menor[0]:null;
const atualEp=(o,e)=>em(o)&&e.f>=T0-DIA;
const EVT=(()=>{if(!EV)return null;let m=0;P.forEach(o=>{if(o.fim>AGORA&&o.fim-AGORA<60*DIA&&ddmm(o.fim)===EV.d)m=Math.max(m,o.fim);});return m||null;})();

/* ---------- veredito: o piso (menor preço dos últimos 24 meses, antes desta promoção) e quanto se ganha ---------- */
const VD={imperdivel:['Imperdível','#4c6b22','#beee11'],menor:['Menor preço','#1f4f4a','#6fe0c8'],espera:['Pode esperar','#262626','#c8c8c8'],
  comum:['Preço de costume','#2a2a2a','#d2d2d2'],sem:['Sem histórico','#2a2a2a','#979797'],vem:['Vem aí','#1a4a6b','#66c0f4'],
  fora:['Fora de promoção','#222222','#979797'],breve:['Em breve','#222222','#979797']};
const RANK={imperdivel:0,menor:1,espera:2,comum:3,sem:4,vem:5,fora:6,breve:7};
const GANHO_MIN=500,GANHO_PCT=.15;   /* imperdível: abaixo do piso por R$ 5 e 15% ou mais */
function verd(o){if(o._v)return o._v;const v=o.pv;let r;
  if(em(o)){const z=v.piso;
    if(o.t==='selo')r=['imperdivel','Selo Kurokami'];
    else if(!o.hist||!z)r=['sem','compare pelo desconto'];
    else{const [pz,n]=z,g=pz-o.preco,abaixo=o.preco<pz-tolP(pz);
      if(abaixo&&g>=GANHO_MIN&&g>=GANHO_PCT*pz)r=['imperdivel',`${brl(g)} abaixo do menor em 2 anos`];
      else if(abaixo)r=['menor',`${brl(g)} abaixo do menor em 2 anos`];
      else if(o.preco<=pz+tolP(pz))r=['menor',n>1?`o menor em 2 anos (${n}×): não fica mais barato`:'o menor em 2 anos'];
      else if(n>=2&&v.piso_volta!=null&&v.piso_volta<=120)r=['espera',`volta a ${brl(pz)} em ${tempo(v.piso_volta)} (${brl(-g)} a menos)`];
      else r=['comum',n>=2?`o menor, ${brl(pz)}, deve demorar`:`o menor, ${brl(pz)}, veio só 1× em 2 anos`];}}
  else if(o.breve)r=['breve',''];
  else if(v.prox_t&&v.prox_t-T0<=30*DIA&&v.prox_c>=4&&v.menor&&v.prox_p<=v.menor[0]+tolP(v.menor[0]))r=['vem',parteMes(v.prox_t)+' · '+brl(v.prox_p)+', o menor que já teve'];
  else r=['fora',v.prox_t?'próxima: '+v.prox_curto:'sem previsão'];
  return o._v=r;}
const vdPill=o=>{const [k,s]=verd(o),c=VD[k];return `<span class="vd" style="--eb:${c[1]};--ec:${c[2]}"><b>${c[0]}</b>${s?' · '+esc(s):''}</span>`;};
const ganho=o=>em(o)&&o.pv.piso?o.pv.piso[0]-o.preco:-1e9;
const ordV=(a,b)=>RANK[verd(a)[0]]-RANK[verd(b)[0]]||ganho(b)-ganho(a)||b.eco-a.eco||b.corte-a.corte;

/* ---------- histórico: faixa (capas e linhas) e gráfico (ficha e painel) ---------- */
const X0=T0-730*DIA,X1=T0+100*DIA,xs=(t,W)=>Math.max(0,Math.min(W,(t-X0)/(X1-X0)*W));
function faixa(o,W=240,Hh=14){const h=HI(o),r=refP(o);
  if(!h.length)return `<span class="fx0">${em(o)?'sem histórico ainda':'sem promoções registradas'}</span>`;
  const x0=xs(T0,W);let s=`<rect width="${W}" height="${Hh}" fill="#ffffff0a"/><rect x="${x0}" width="${W-x0}" height="${Hh}" fill="#66c0f414"/>`;
  for(const e of h){if(e.f<X0)continue;const a=xs(e.t,W),w=Math.max(1.5,xs(e.f,W)-a),cur=atualEp(o,e),ok=r!=null&&e.p<=r+tolP(r);
    s+=`<rect x="${a.toFixed(1)}" y="${cur?0:2}" width="${w.toFixed(1)}" height="${cur?Hh:Hh-4}" fill="${cur?'#66c0f4':ok?'#beee11':'#474747'}"/>`;}
  const v=o.pv;if(v.prox_t&&v.prox_t<X1){const a=xs(v.prox_t,W);s+=`<rect x="${(a-1.5).toFixed(1)}" y="1" width="3" height="${Hh-2}" fill="none" stroke="#66c0f4" stroke-dasharray="2 1.5"/>`;}
  s+=`<rect x="${x0-.5}" width="1" height="${Hh}" fill="#ffffff80"/>`;
  return `<svg class="fx1" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="Promoções nos últimos 24 meses"><title>Últimos 24 meses · verde: ${em(o)?'esse preço':'o menor preço'} ou menor · azul: a promoção de agora · tracejado: a próxima prevista</title>${s}</svg>`;}
function faixaTxt(o){const v=o.pv;
  if(em(o)){if(!o.hist)return 'sem histórico ainda';if(v.k24==null)return '';return v.k24?`${v.k24}× nesse preço em 2 anos`:'1ª vez nesse preço em 2 anos';}
  if(o.breve)return 'em breve';return v.menor?`menor: ${brl(v.menor[0])} (${v.menor[1]})`:'sem promoções registradas';}
function grafico(o){const h=HI(o).filter(e=>e.f>=X0);if(!h.length)return '';
  const W=640,Hh=190,L0=80,R0=10,T=14,B=22,r=refP(o),v=o.pv;
  const top=Math.max(o.cheio||0,...h.map(e=>e.p),o.preco||0,v.prox_p||0)||1;
  const X=t=>L0+(Math.max(X0,Math.min(X1,t))-X0)/(X1-X0)*(W-L0-R0),Y=p=>T+(1-p/top)*(Hh-T-B);
  let s='';
  for(const d=new Date(X0*1000);d.getTime()/1000<X1;d.setMonth(d.getMonth()+1)){d.setDate(1);const t=d.getTime()/1000;
    if(t>X0&&d.getMonth()%3===0){const x=X(t);s+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${Hh-B}" stroke="#ffffff12"/><text x="${x}" y="${Hh-6}" class="gm">${MESES[d.getMonth()]}/${String(d.getFullYear()).slice(2)}</text>`;}}
  (D.EV||[]).forEach(t=>{if(t>X0&&t<X1)s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${Hh-B}" stroke="#ffd75e55" stroke-dasharray="3 3"/>`;});
  s+=`<rect x="${X(T0)}" y="${T}" width="${W-R0-X(T0)}" height="${Hh-T-B}" fill="#66c0f40f"/><text x="${X(T0)+4}" y="${T+10}" class="gm" style="text-anchor:start">hoje</text>`;
  const lin=(p,c,t,dash)=>`<line x1="${L0}" x2="${W-R0}" y1="${Y(p)}" y2="${Y(p)}" stroke="${c}"${dash?' stroke-dasharray="4 3"':''}/><text x="${L0-6}" y="${Y(p)+4}" class="gp" fill="${c}">${t}</text>`;
  if(o.cheio&&(r==null||Math.abs(Y(o.cheio)-Y(r))>12))s+=lin(o.cheio,'#666666','cheio '+brl0(o.cheio));
  for(const e of h){const a=X(e.t),w=Math.max(2,X(e.f)-a),cur=atualEp(o,e),ok=r!=null&&e.p<=r+tolP(r),y=Y(e.p);
    s+=`<g><title>${mesAno(e.t)} · ${brl(e.p)} (-${e.c}%)</title><rect x="${a.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(Hh-B-y).toFixed(1)}" fill="${cur?'#66c0f444':ok?'#beee1129':'#47474740'}"/><rect x="${a.toFixed(1)}" y="${(y-1.2).toFixed(1)}" width="${w.toFixed(1)}" height="2.5" fill="${cur?'#66c0f4':ok?'#beee11':'#8a8a8a'}"/></g>`;}
  if(r!=null)s+=lin(r,'#beee11',brl0(r),true);
  if(v.prox_t&&v.prox_p&&v.prox_t<X1){const x=X(v.prox_t),y=Y(v.prox_p);
    s+=`<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="#66c0f4" stroke-width="2" stroke-dasharray="3 2"/><text x="${x-9}" y="${Math.max(T+10,y-9)}" class="gp" fill="#66c0f4">próxima: ${esc(v.prox_curto||'')}</text>`;}
  return `<svg class="graf" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Promoções nos últimos 24 meses">${s}</svg>`;}
function grafBox(o){const g=grafico(o);if(!g)return '';
  return `<div class="gbox"><div class="k">Promoções nos últimos 24 meses, nas suas lojas</div>${g}<div class="gl"><span><i style="background:#beee11"></i>${em(o)?'esse preço ou menor':'no menor preço'}</span><span><i style="background:#8a8a8a"></i>outras promoções</span>${em(o)?'<span><i style="background:#66c0f4"></i>a de agora</span>':''}${o.pv.prox_t?'<span><i class="o"></i>próxima prevista</span>':''}<span><i style="background:#ffd75e88"></i>grandes eventos da Steam</span></div></div>`;}

/* ---------- peças comuns ---------- */
function fechaPop(){S.pop=false;const p=$('.fpop');if(p)p.hidden=true;const a=$('[data-pop]');if(a)a.setAttribute('aria-expanded','false');}
const faixaEv=(full=true)=>EV?`<div class="${full?'full ':''}fev"><b>★ ${esc(EVN)} até ${EV.d}</b><span>${fmtN(EV.n)} promoções terminam juntas · ${fmtN(D.steam)} em promoção na Steam</span><button class="vt" data-go="promo">ver as promoções ›</button></div>`:'';
/* banner: as 10 melhores da lista (com o filtro escondido do Destaques) */
const BAN=(()=>{let c=null;return ()=>c||(c=[L.filter(o=>em(o)&&o.hist&&!gratis(o)&&fl(o)).sort(ordV).slice(0,10),[]]);})();
function banner(){const [a,b]=BAN(),H=[...a,...b];if(!H.length)return '';S.h=(S.h+H.length)%H.length;
  const o=H[S.h],j=reg({k:'jogo',o}),v=o.pv,[k,sv]=verd(o),c=VD[k],pop=S.h>=a.length;
  const mini=(x,i)=>`<div><button data-h="${i}" aria-current="${i===S.h}" title="${esc(x.nome)}">${imgH(x)}<span class="mh"><span class="et" style="--eb:${VD[verd(x)[0]][1]};--ec:${VD[verd(x)[0]][2]}">-${x.corte}%</span></span></button></div>`;
  return `<div class="full ban3" data-ban><div class="bg" style="background-image:url('${CDN+o.appid}/library_hero.jpg')"></div>
   <button class="bnav e" data-hp="-1" title="Anterior">‹</button><button class="bnav d" data-hp="1" title="Próximo">›</button><div class="w3 anim">
    <div class="top3"><button data-nav data-j="${j}" style="border:0;padding:0;background:none;cursor:pointer" title="${esc(o.nome)}">${imgH(o,'hcap')}</button>

/* ---------- tempo: quando acaba, quando vem (B) ---------- */
function bucketsFim(){const d=new Date(AGORA*1000),dia=n=>{const x=new Date(d);x.setDate(x.getDate()+n);x.setHours(23,59,59,0);return x.getTime()/1000;};
  const b1=dia(1),b2=Math.max(dia((7-d.getDay())%7),b1),b3=EVT&&fimDoDia(EVT)>b2?fimDoDia(EVT):dia(14),ev=EVT&&fimDoDia(EVT)>b2;
  return [['f0','Hoje e amanhã','até amanhã',o=>o.fim>AGORA&&o.fim<=b1],
    ['f1','Até dom., '+ddmm(b2),'até domingo, '+ddmm(b2),o=>o.fim>AGORA&&o.fim<=b2],
    ['f2',ev?`Até ${ddmm(b3)} · ${EVN.replace('Promoção de ','').replace(' da Steam','')}`:'Até '+ddmm(b3),ev?`até ${ddmm(b3)}, com a ${EVN}`:'até '+ddmm(b3),o=>o.fim>AGORA&&o.fim<=b3],
    ['f3','Depois ou sem data','depois disso, ou sem data de fim',o=>true]];}
function bucketsMes(){const d=new Date(AGORA*1000),y=d.getFullYear(),m=d.getMonth(),ini=i=>new Date(y,m+i,1).getTime()/1000,nm=i=>MESN[(m+i)%12],out=[];
  for(let i=0;i<3;i++){const a=i?ini(i):0,b=ini(i+1),n=nm(i),inv=(m+i)%12===11?' · Inverno':'';
    out.push(['m'+i,(i?n[0].toUpperCase()+n.slice(1):'Resto de '+n)+inv,(i?'em '+n:'no resto de '+n)+(inv?', na Promoção de Inverno':''),t=>t>=a&&t<b]);}
  out.push(['m3','De '+nm(3)+' em diante','de '+nm(3)+' em diante',t=>t>=ini(3)]);return out;}

  return `<button class="mb" data-nav data-j="${j}" data-L="${o.L}" title="${esc(o.nome)}"><span class="im">${imgH(o)}${em(o)?`<span class="pz"><span class="pc">-${o.corte}%</span>${precoTxt(o)}</span>`:''}</span><span class="n">${esc(o.nome)}</span><span class="s" style="color:${em(o)?c[2]:'#66c0f4'}">${esc(lin)}</span></button>`;}

  const bl=o==='melhor'?(d[0]==='tudo'?secVerd(l):[['','',l.sort(d[5]||ordV),'p']]):[['','',l.sort(SORT[o]),'p']];
  return `${cardsRec(base,REC_P,'promo')}${d[0]==='baratos'?tetosRow():''}
   <div class="tool"><div class="l1">${chipsOrd()}<span class="sp"></span><span class="cnt"><b>${fmtN(l.length)}</b> de ${fmtN(P.length)} · ${fmtN(D.steam)} em promoção na Steam</span>${btnF('promo')}${qIn()}</div>${barraFiltros('promo')}</div>
   ${l.length?blocos(bl,rend):vazioF}`;}

/* ---------- Lista de desejos ---------- */
const SECS=[['imperdivel','Imperdíveis','abaixo do menor preço em 2 anos por R$ 5 e 15% ou mais · pelo ganho',(a,b)=>ganho(b)-ganho(a)],
  ['menor','No menor preço','o menor em 2 anos: não costuma ficar mais barato · pela economia',(a,b)=>b.eco-a.eco],
  ['espera','Pode esperar','o menor preço volta logo · vale esperar',(a,b)=>(a.pv.piso_volta||999)-(b.pv.piso_volta||999)],
  ['comum','Preço de costume','acima do menor, que é raro ou demora · pelo desconto',SORT.desc],
  ['sem','Sem histórico','o Hunter ainda não tem as promoções antigas · pelo desconto',SORT.desc],
  ['vem','Vem aí','fora de promoção; deve voltar em até 30 dias no menor preço',SORT.prox],
  ['fora','Fora de promoção','pela próxima promoção prevista',SORT.prox],['breve','Em breve','ainda não lançados',SORT.az]];
const secVerd=l=>SECS.map(([k,t,s,so])=>{const g=l.filter(o=>verd(o)[0]===k).sort(so);return [t,`${fmtN(g.length)} · ${s}`,g,'p',k];}).filter(b=>b[2].length);
const REC_L=[['agora','Compre agora','imperdíveis e no menor preço','#beee11',o=>em(o)&&['imperdivel','menor'].includes(verd(o)[0]),ordV],
  ['fim','Acabam em 3 dias','as melhores primeiro','#ff7b6b',o=>em(o)&&o.fim>AGORA&&o.fim-AGORA<=3*DIA,ordV],
  ['espera','Pode esperar','o menor preço volta logo','#c8c8c8',o=>em(o)&&verd(o)[0]==='espera',ordV],
  ['vem','Vem aí','fora de promoção; deve entrar em 30 dias','#66c0f4',o=>verd(o)[0]==='vem',SORT.prox],
  ['baratos','Até R$ 25','em promoção, os melhores primeiro','#ffb36b',o=>em(o)&&!gratis(o)&&o.preco<=2500,ordV]];
const VER_L=[['todos','Todos',o=>true],['promo','Em promoção',em],['fora','Fora de promoção',o=>!em(o)&&!o.breve],['breve','Em breve',o=>!!o.breve]];
/* orçamento: entre os melhores negócios da lista (imperdíveis e no menor preço), a combinação que cabe no valor e
   rende a maior economia (mochila em reais inteiros; imperdível vale 1,3× a economia) */
function mochila(c,B){const W=Math.floor(B/100),w=c.map(o=>Math.ceil(o.preco/100)),v=c.map(o=>o.eco*(verd(o)[0]==='imperdivel'?1.3:1));
  const best=new Float64Array(W+1),pega=c.map(()=>new Uint8Array(W+1));
  c.forEach((o,i)=>{for(let x=W;x>=w[i];x--)if(best[x-w[i]]+v[i]>best[x]){best[x]=best[x-w[i]]+v[i];pega[i][x]=1;}});
  const out=[];let x=W;for(let i=c.length-1;i>=0;i--)if(pega[i][x]){out.push(c[i]);x-=w[i];}
  return out.sort(ordV);}
function orcamento(base){const B=S.orc,c=base.filter(o=>em(o)&&!gratis(o)&&['imperdivel','menor'].includes(verd(o)[0])).sort(ordV);
  const p=mochila(c,B),tot=p.reduce((a,o)=>a+o.preco,0);
  const eco=p.reduce((a,o)=>a+o.eco,0),ch=p.reduce((a,o)=>a+(o.cheio||0),0),bg=p[0];
  return `<div class="orc">${bg?`<div class="obg" style="background-image:url('${CDN+bg.appid}/library_hero.jpg')"></div>`:''}<div class="oin">
   <div class="oesq"><div class="k">Sua lista hoje · ${fmtN(c.length)} valem comprar agora</div>
    <div class="ot">Com <span class="seg2">${[5000,10000,20000,50000].map(v=>`<button data-orc="${v}" aria-pressed="${v===B}">${brl0(v)}</button>`).join('')}</span></div>
    <div class="ob">você leva <b>${p.length}</b> jogo${p.length===1?'':'s'} por <b class="g">${brl(tot)}</b></div>
    <div class="os">${p.length?`eram ${brl0(ch)} · economia de <b>${brl0(eco)}</b> · a maior economia que cabe`:'nenhum dos melhores negócios cabe nesse valor'}</div>
    ${p.length?`<button class="btn verde" data-mais="${p.map(o=>o.appid)}">Pôr os ${p.length} no carrinho</button>`:''}</div>
   <div class="fil ocap" style="--cw:112px"><div class="trilho arr">${p.map(o=>{const j=reg({k:'jogo',o}),c2=VD[verd(o)[0]];
     return `<div><button class="capa ofp" data-nav data-j="${j}" title="${esc(o.nome)}">${imgV(o)}<span class="ok" style="background:${c2[1]};color:${c2[2]}">-${o.corte}%</span></button><div class="op">${brl(o.preco)}</div></div>`;}).join('')}</div></div></div></div>`;}
function pagListaM(){const m=modo(),f=S.f.lista,o=ordem(),base=L.filter(x=>passa(x,f,'lista')),k=S.rec.lista;
  const d=REC_L.find(x=>x[0]===k),vv=VER_L.find(x=>x[0]===k)||VER_L[0],l=base.filter(d?d[4]:vv[2]);
  const top=orcamento(base)+cardsRec(base,REC_L,'lista')
   +`<div class="tool"><div class="l1"><span class="vers">${VER_L.filter(([w,t,fn])=>w===k||base.some(fn)).map(([w,t,fn])=>`<button data-rec="${w}" aria-pressed="${k===w}">${t} <small>${fmtN(base.filter(fn).length)}</small></button>`).join('')}</span><span class="sp"></span>${chipsOrd()}${btnF('lista')}${qIn()}<span class="views">${[['jogos','▦ Jogos'],['franquias','▦ Franquias']].map(([x,t])=>`<button data-modo="${x}" aria-pressed="${m===x}">${t}</button>`).join('')}</span></div>${barraFiltros('lista')}</div>`;
  if(m==='franquias'){const best=x=>Math.min(...x.m.map(y=>RANK[verd(y)[0]])),ok=new Set(l),
      fl2=FRL.filter(x=>x.m.some(y=>ok.has(y))).sort((a,b)=>best(a)-best(b)||b.pm.length-a.pm.length||a.kk.localeCompare(b.kk,'pt-BR')),tudo=fl2.slice(0,S.lim);
    return top+`<div class="vit">${tudo.map(pilhaFR).join('')}</div>${maisL(tudo.length,fl2.length)}`;}
  const bl=o==='melhor'?(d&&d[0]!=='agora'?[['','',l.sort(d[5]),'p']]:secVerd(l)):[['','',l.sort(SORT[o]),'p']];
  return top+(l.length?blocos(bl,rend):vazioF);}

/* ---------- dentro do painel: a ficha do jogo, o carrinho e a loja são os do painel (window.parent.KH) ---------- */
const PAI=(()=>{try{return parent!==window&&parent.KH?parent.KH:null;}catch(e){return null;}})();
function avisaPai(aba){try{history.replaceState(null,'','#'+S.sub);}catch(e){}if(PAI&&PAI.sub)PAI.sub(aba,S.sub);}
window.irSub=s=>{if(!SUBS.some(x=>x[0]===s)||(s===S.sub&&S.aberto==null))return;if(S.aberto!=null)fecha();S.sub=s;S.q='';if('lim' in S)S.lim=120;desenha();scrollTo(0,0);};
addEventListener('hashchange',()=>irSub(location.hash.slice(1)));
const pedeCarr=(ids,mon)=>{ids=[...new Set(ids.filter(Boolean).map(Number))];if(!ids.length){toast('Nada para pôr no carrinho');return;}
  if(PAI)PAI.carrinho(ids.map(a=>({appid:a,mon:mon?mon(a):false})));else toast('No carrinho (abra pelo painel)');};
const ehJogo=x=>x.k==='jogo'||(x.k==='fr'&&x.m&&x.m.length===1);
const jogoDe=x=>x.o||x.m[0];
/* o que a ficha do painel mostra no lugar da caixa antiga: o veredito, as 2 frases e o "por quê" */
function vered(o){const v=o.pv,[k,sv]=verd(o),c=VD[k],p=etqP(o);
  return {rot:c[0],bg:c[1],cor:c[2],sub:sv||'',fatos:fatos(o),porque:[v.se1,v.se2,v.prox1,v.prox2].filter(Boolean),
    etq:p?[p[0],ET[p[1]][1],ET[p[1]][2]]:null,selo:o.t==='selo'&&o.motivo?o.motivo:'',fora:!em(o)&&o.preco==null};}
function fichaPai(lst,j){const gs=[],vis=new Set();
  lst.forEach(x=>{if(!ehJogo(x))return;const g=jogoDe(x);if(!vis.has(g.appid)){vis.add(g.appid);gs.push(g);}});
  const alvo=jogoDe(lst[j]);let i=Math.max(0,gs.findIndex(g=>g.appid===alvo.appid));
  const mostra=()=>{const g=gs[i];PAI.ficha(g.appid,{vered:vered(g),pos:gs.length>1?`${i+1} de ${gs.length}`:'',
    passo:gs.length>1?d=>{i=(i+d+gs.length)%gs.length;mostra();}:null});};
  mostra();}
function maisCarr(b){let ids=(b.dataset.mais||'').split(',').filter(Boolean);
  if(!ids.length){const lst=b.closest('#ov')?OV:S.lista,c=b.closest('[data-j]')||(b.closest('.hc')||b.parentNode).querySelector('[data-j]'),y=c&&lst[+c.dataset.j];
    if(y)ids=[jogoDe(y).appid];}
  pedeCarr(ids,a=>!LID.has(a));}
{const h=location.hash.slice(1);if(SUBS.some(x=>x[0]===h))S.sub=h;}
desenha();
</script>
